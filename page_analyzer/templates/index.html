<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Анализатор страниц</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
          rel="stylesheet"  
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">
          Анализатор страниц
        </a>

        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-3">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('urls') }}">
                Сайты
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} mt-3">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <h1 class="text-center">Анализатор страниц</h1>
      <p class="text-center">Бесплатно проверяйте ваши сайты на SEO-пригодность</p>


      <form action="{{ url_for('add_url') }}" method="post" class="row justify-content-center mt-4">
        <div class="col-md-6">
          <input type="text" name="url" class="form-control" placeholder="https://example.com" required> 
          <button type="submit" class="btn btn-primary mt-2">Проверить</button>
          
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" 
            crossorigin="anonymous"></script>
  </body>
</html>
